# Local PostgreSQL for development:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
      POSTGRES_DB: northstar
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
